<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pinboard — your personal notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Sora:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-pin">📌</span>
      <span class="brand-name">Pinboard</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="all">
        <span class="nav-dot" style="--dot:#E0A63A"></span> Everything
      </button>
      <button class="nav-item" data-view="books">
        <span class="nav-dot" style="--dot:#C97B84"></span> Books
      </button>
      <button class="nav-item" data-view="scheduler">
        <span class="nav-dot" style="--dot:#6E96A8"></span> Scheduler
      </button>
      <button class="nav-item" data-view="tasks">
        <span class="nav-dot" style="--dot:#6B7A5E"></span> To-dos
      </button>
      <button class="nav-item" data-view="notes">
        <span class="nav-dot" style="--dot:#F4D9A0"></span> Notes
      </button>
    </nav>

    <div class="sidebar-stats" id="sidebarStats">
      <p class="stats-title">This board, so far</p>
      <div class="stats-row"><span id="statBooks">0</span> books finished</div>
      <div class="stats-row"><span id="statTasks">0/0</span> tasks done</div>
      <div class="stats-row"><span id="statNotes">0</span> notes pinned</div>
      <div class="stats-row"><span id="statEvents">0</span> upcoming</div>
    </div>

    <p class="sidebar-hint">✂️ pin it, check it off,<br>watch the board fill up.</p>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <header class="topbar">
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Search your board…" />
      </div>
      <button class="add-btn" id="openAddModal">+ Pin something</button>
    </header>

    <h1 class="view-title" id="viewTitle">Everything</h1>
    <p class="view-sub" id="viewSub">Books, plans, to-dos and notes — all pinned in one place.</p>

    <section class="board" id="board">
      <!-- cards injected by script.js -->
    </section>

    <p class="empty-state" id="emptyState" hidden>Nothing here yet — pin your first one.</p>
  </main>

  <!-- ================= ADD MODAL ================= -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      
       <button type="button" id="closeModal" aria-label="Close modal">×</button>


      <div class="modal-tabs" id="modalTabs">
        <button class="modal-tab active" data-type="note">Note</button>
        <button class="modal-tab" data-type="task">To-do</button>
        <button class="modal-tab" data-type="book">Book</button>
        <button class="modal-tab" data-type="event">Schedule</button>
      </div>

      <form id="itemForm">
        <input type="hidden" id="formType" value="note" />

        <label class="field">
          <span>Title</span>
          <input type="text" id="fieldTitle" required placeholder="Give it a name…" />
        </label>

        <!-- NOTE fields -->
        <div class="field-group" data-group="note">
          <label class="field">
            <span>Content</span>
            <textarea id="fieldContent" rows="4" placeholder="What's on your mind?"></textarea>
          </label>
          <label class="field">
            <span>Sticky color</span>
            <div class="color-swatches" id="noteColorSwatches"></div>
          </label>
        </div>

        <!-- TASK fields -->
        <div class="field-group" data-group="task" hidden>
          <label class="field">
            <span>Details</span>
            <textarea id="fieldTaskDesc" rows="3" placeholder="Optional details…"></textarea>
          </label>
          <div class="field-row">
            <label class="field">
              <span>Priority</span>
              <select id="fieldPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>
            <label class="field">
              <span>Due date</span>
              <input type="date" id="fieldDueDate" />
            </label>
          </div>
        </div>

        <!-- BOOK fields -->
        <div class="field-group" data-group="book" hidden>
          <label class="field">
            <span>Author</span>
            <input type="text" id="fieldAuthor" placeholder="Who wrote it?" />
          </label>
          <div class="field-row">
            <label class="field">
              <span>Status</span>
              <select id="fieldBookStatus">
                <option value="want_to_read">Want to read</option>
                <option value="reading">Reading</option>
                <option value="finished">Finished</option>
              </select>
            </label>
            <label class="field">
              <span>Rating</span>
              <select id="fieldRating">
                <option value="0">No rating</option>
                <option value="1">★</option>
                <option value="2">★★</option>
                <option value="3">★★★</option>
                <option value="4">★★★★</option>
                <option value="5">★★★★★</option>
              </select>
            </label>
          </div>
        </div>

        <!-- EVENT fields -->
        <div class="field-group" data-group="event" hidden>
          <label class="field">
            <span>Notes</span>
            <textarea id="fieldEventDesc" rows="3" placeholder="Optional details…"></textarea>
          </label>
          <div class="field-row">
            <label class="field">
              <span>Date</span>
              <input type="date" id="fieldEventDate" />
            </label>
            <label class="field">
              <span>Time</span>
              <input type="time" id="fieldEventTime" />
            </label>
          </div>
          <label class="field">
            <span>Category</span>
            <input type="text" id="fieldEventCategory" placeholder="routine, work, birthday…" />
          </label>
        </div>

        <button type="submit" class="submit-btn">Pin it</button>
      </form>
    </div>
  </div>

  <!-- ================= CELEBRATION LAYER ================= -->
  <canvas id="confettiCanvas"></canvas>
  <div class="celebrate-banner" id="celebrateBanner">
    <span id="celebrateText">Nice work! 🎉</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
